# Nginx configuration for mycircle.mistyvisuals.com
# Drop this file into /etc/nginx/sites-available/mycircle.mistyvisuals.com
# and symlink to /etc/nginx/sites-enabled/
#
# This configuration bypasses Next.js for all API requests, routing /api/*
# directly to the Fastify backend on port 3004. This cuts CPU and RAM usage
# in half by eliminating double-process Node.js proxying.

upstream fastify_backend {
    server 127.0.0.1:3004;
    keepalive 32;
}

upstream nextjs_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mycircle.mistyvisuals.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mycircle.mistyvisuals.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/mycircle.mistyvisuals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mycircle.mistyvisuals.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Safe request body size (matching Fastify's 50MB limit)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Direct API routing -> Fastify Backend (Port 3004)
    # Bypasses Next.js entirely to save 1 vCPU / RAM
    location /api/ {
        proxy_pass http://fastify_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for longer requests (like ZIP generation)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable response buffering for downloads & streams
        proxy_buffering off;
    }

    # 2. Next.js Static Assets (_next/static) -> Long-term Cache
    location /_next/static {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. All other web traffic -> Next.js Frontend (Port 3000)
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
